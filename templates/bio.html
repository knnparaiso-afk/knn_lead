<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080812">
  <title>KNN Paraisópolis | Links oficiais</title>
  <meta name="description" content="KNN Paraisópolis. Agende uma aula grátis, entre na comunidade e conheça nosso site oficial.">
  <link rel="canonical" href="{{ canonical_url }}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="KNN Paraisópolis | Links oficiais">
  <meta property="og:description" content="Aula grátis, comunidade e site oficial. Conecte-se com a KNN Paraisópolis.">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:image" content="{{ imagem_url }}">
  <meta property="og:image:width" content="1254">
  <meta property="og:image:height" content="1254">
  <meta property="og:image:alt" content="Arte oficial Black November KNN, em roxo e laranja">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{ url_for('static', filename='img/logo-knn.png') | v }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bio.css') | v }}">
</head>
<body>
  <a class="skip-link" href="#links">Ir para os links</a>
  <main class="bio-shell">
    <header class="profile">
      <a class="brand" href="{{ url_for('public.index') }}" aria-label="Site da KNN Paraisópolis">
        <img src="{{ url_for('static', filename='img/logo-knn-branco.png') | v }}" alt="KNN Idiomas" width="94" height="48">
      </a>
      <h1>KNN Paraisópolis</h1>
      <p class="intro">Aprender um novo idioma é um ato de liberdade.</p>
      <a class="instagram" href="{{ u.instagram }}" target="_blank" rel="noopener noreferrer" aria-label="Instagram da KNN Paraisópolis (abre em nova aba)">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="instagram-dot" cx="17.5" cy="6.5" r="1"/></svg>
      </a>
    </header>

    <p class="campaign-label">BLACK <span>NOVEMBER</span></p>
    <nav class="bio-links" id="links" aria-label="Links da KNN Paraisópolis" tabindex="-1">
      <a class="link-card link-primary" href="{{ aula_url }}" target="_blank" rel="noopener noreferrer">
        Agendar minha aula grátis
      </a>
      <a class="link-card" href="{{ comunidade_url }}" target="_blank" rel="noopener noreferrer">
        {{ 'Entrar na comunidade KNN' if comunidade_direta else 'Pedir acesso à comunidade KNN' }}
      </a>
      <a class="link-card" href="{{ url_for('public.index') }}">
        Conhecer nosso site oficial
      </a>
    </nav>

    <footer class="bio-footer">
      <span>KNN Idiomas · Paraisópolis, MG</span>
    </footer>
  </main>
</body>
</html>
