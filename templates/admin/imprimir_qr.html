<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartaz A4 · {{ qr.codigo }}</title>
    <style>
        :root {
            --knn-red: #ed1b2f;
            --knn-red-dark: #c9001d;
            --text-dark: #111827;
            --bg-gray: #e5e7eb;
            --line: #d1d5db;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-gray);
            color: var(--text-dark);
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px 20px;
            padding: 14px 24px;
            background: #fff;
            border-bottom: 1px solid var(--line);
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }

        .toolbar-info { flex: 1 1 250px; }
        .toolbar-info h1 { font-size: 18px; font-weight: 800; }
        .toolbar-info h1 span { color: var(--knn-red); }
        .toolbar-info p { margin-top: 4px; color: #6b7280; font-size: 13px; }

        .art-choices { display: flex; align-items: center; gap: 9px; }
        .art-choice {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 145px;
            padding: 6px 9px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            color: #374151;
            text-decoration: none;
            transition: border-color .15s ease, background .15s ease;
        }
        .art-choice:hover { border-color: var(--knn-red); }
        .art-choice[aria-current="page"] {
            border-color: var(--knn-red);
            background: #fff4f5;
            box-shadow: 0 0 0 2px rgba(237,27,47,.1);
        }
        .art-choice img {
            display: block;
            width: 39px;
            height: 55px;
            object-fit: cover;
            border: 1px solid #e5e7eb;
            border-radius: 3px;
        }
        .art-choice span { font-size: 12px; font-weight: 700; }

        .toolbar-actions { display: flex; align-items: center; gap: 8px; }
        .btn {
            display: inline-flex;
            min-height: 38px;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            color: #374151;
            font: 700 12px 'Segoe UI', Arial, sans-serif;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-primary { border-color: var(--knn-red); background: var(--knn-red); color: #fff; }
        .btn-primary:hover { background: var(--knn-red-dark); }

        .print-canvas-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px 40px;
        }
        .paper-card {
            width: min(680px, 100%);
            aspect-ratio: 210 / 297;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,.15);
        }
        .paper-card img { display: block; width: 100%; height: 100%; object-fit: contain; }

        @media (max-width: 980px) {
            .toolbar-info { flex-basis: 100%; text-align: center; }
            .art-choices { flex: 1 1 auto; justify-content: center; }
            .toolbar-actions { flex: 1 1 auto; justify-content: center; }
        }
        @media (max-width: 540px) {
            .toolbar { padding: 12px; }
            .toolbar-info p { max-width: 360px; margin: 5px auto 0; }
            .art-choices { width: 100%; }
            .art-choice { min-width: 0; flex: 1; justify-content: center; padding: 6px; }
            .art-choice img { width: 34px; height: 49px; }
            .toolbar-actions { width: 100%; flex-wrap: wrap; }
            .toolbar-actions .btn { flex: 1; }
            .print-canvas-area { padding: 16px 10px 28px; }
        }

        @page { size: A4 portrait; margin: 0; }
        @media print {
            html, body { width: 210mm; height: 297mm; min-height: 297mm; margin: 0 !important; background: #fff !important; }
            .toolbar { display: none !important; }
            .print-canvas-area { display: block !important; width: 210mm; height: 297mm; margin: 0 !important; padding: 0 !important; }
            .paper-card { width: 210mm !important; height: 297mm !important; aspect-ratio: auto; box-shadow: none; }
            .paper-card img { width: 210mm !important; height: 297mm !important; object-fit: fill !important; }
        }
    </style>
</head>
<body>
    <header class="toolbar">
        <div class="toolbar-info">
            <h1>Cartaz A4 <span>· {{ qr.codigo }}</span></h1>
            <p>Escolha uma das artes. O QR Code aparece no campo central, pronto para imprimir.</p>
        </div>

        <nav class="art-choices" aria-label="Escolha a arte do cartaz">
            {% for arte in artes %}
            <a class="art-choice" href="{{ url_for('qr.imprimir_qr', codigo=qr.codigo, arte=arte.id) }}"
                data-image-url="{{ url_for('qr.imagem_qr', codigo=qr.codigo, arte=arte.id) }}"
                data-download-url="{{ url_for('qr.download_qr', codigo=qr.codigo, arte=arte.id) }}"
                aria-current="{{ 'page' if arte.id == arte_selecionada else 'false' }}">
                <img src="{{ url_for('static', filename=arte.thumbnail) }}" alt="">
                <span>{{ arte.nome }}</span>
            </a>
            {% endfor %}
        </nav>

        <div class="toolbar-actions">
            <a href="{{ url_for('qr.gerenciar_qr', campanha_id=qr.campanha_id) }}" class="btn">Voltar</a>
            <a id="download-art" href="{{ download_url }}" class="btn">Baixar PNG A4</a>
            <button type="button" onclick="window.print()" class="btn btn-primary">Imprimir</button>
        </div>
    </header>

    <main class="print-canvas-area">
        <div class="paper-card">
            <img id="poster-preview" src="{{ imagem_url }}" alt="Cartaz A4 com o QR Code {{ qr.codigo }}">
        </div>
    </main>

    <script>
        const preview = document.getElementById("poster-preview");
        const download = document.getElementById("download-art");
        const artChoices = document.querySelectorAll(".art-choice");

        artChoices.forEach((choice) => {
            choice.addEventListener("click", (event) => {
                event.preventDefault();
                preview.src = choice.dataset.imageUrl;
                download.href = choice.dataset.downloadUrl;
                artChoices.forEach((item) => item.setAttribute("aria-current", "false"));
                choice.setAttribute("aria-current", "page");
                window.history.replaceState({}, "", choice.href);
            });
        });
    </script>
</body>
</html>
