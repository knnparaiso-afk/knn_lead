<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartaz {{ formato.nome }} · {{ qr.codigo }}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') | v }}">
    <style>
        :root {
            --knn-red: #ed1b2f;
            --knn-red-dark: #c9001d;
            --text-dark: #111827;
            --bg-gray: #e5e7eb;
            --line: #d1d5db;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-gray);
            color: var(--text-dark);
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px 20px;
            padding: 14px 24px;
            background: #fff;
            border-bottom: 1px solid var(--line);
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }

        .toolbar-info { flex: 1 1 250px; }
        .toolbar-info h1 { font-size: 18px; font-weight: 800; }
        .toolbar-info h1 span { color: var(--knn-red); }
        .toolbar-info p { margin-top: 4px; color: #6b7280; font-size: 13px; }

        .art-choices { display: flex; align-items: center; gap: 9px; }
        .art-choice {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 145px;
            padding: 6px 9px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            color: #374151;
            text-decoration: none;
            transition: border-color .15s ease, background .15s ease;
        }
        .art-choice:hover { border-color: var(--knn-red); }
        .art-choice[aria-current="page"] {
            border-color: var(--knn-red);
            background: #fff4f5;
            box-shadow: 0 0 0 2px rgba(237,27,47,.1);
        }
        .art-choice img {
            display: block;
            width: 39px;
            height: 55px;
            object-fit: cover;
            border: 1px solid #e5e7eb;
            border-radius: 3px;
        }
        .art-choice span { font-size: 12px; font-weight: 700; }

        .paper-sizes { display: flex; align-items: center; gap: 6px; }
        .paper-size {
            min-height: 38px;
            padding: 8px 13px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            color: #374151;
            font: 700 12px 'Segoe UI', Arial, sans-serif;
            text-decoration: none;
        }
        .paper-size:hover { border-color: var(--knn-red); }
        .paper-size[aria-current="page"] {
            border-color: var(--knn-red);
            background: #fff4f5;
            color: var(--knn-red-dark);
            box-shadow: 0 0 0 2px rgba(237,27,47,.1);
        }

        .toolbar-actions { display: flex; align-items: center; gap: 8px; }
        .btn {
            display: inline-flex;
            min-height: 38px;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            color: #374151;
            font: 700 12px 'Segoe UI', Arial, sans-serif;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-primary { border-color: var(--knn-red); background: var(--knn-red); color: #fff; }
        .btn-primary:hover { background: var(--knn-red-dark); }

        .print-canvas-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px 40px;
        }
        .paper-card {
            width: min(680px, 100%);
            aspect-ratio: {{ formato.largura_mm }} / {{ formato.altura_mm }};
            overflow: hidden;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,.15);
        }
        .paper-card img { display: block; width: 100%; height: 100%; object-fit: contain; }

        @media (max-width: 980px) {
            .toolbar-info { flex-basis: 100%; text-align: center; }
            .art-choices { flex: 1 1 auto; justify-content: center; }
            .paper-sizes { flex: 1 1 auto; justify-content: center; }
            .toolbar-actions { flex: 1 1 auto; justify-content: center; }
        }
        @media (max-width: 540px) {
            .toolbar { padding: 12px; }
            .toolbar-info p { max-width: 360px; margin: 5px auto 0; }
            .art-choices { width: 100%; }
            .art-choice { min-width: 0; flex: 1; justify-content: center; padding: 6px; }
            .art-choice img { width: 34px; height: 49px; }
            .paper-sizes { width: 100%; }
            .paper-size { flex: 1; text-align: center; }
            .toolbar-actions { width: 100%; flex-wrap: wrap; }
            .toolbar-actions .btn { flex: 1; }
            .print-canvas-area { padding: 16px 10px 28px; }
        }

        @page { size: {{ formato.nome }} portrait; margin: 0; }
        @media print {
            html, body { width: {{ formato.largura_mm }}mm; height: {{ formato.altura_mm }}mm; min-height: {{ formato.altura_mm }}mm; margin: 0 !important; background: #fff !important; }
            .toolbar { display: none !important; }
            .print-canvas-area { display: block !important; width: {{ formato.largura_mm }}mm; height: {{ formato.altura_mm }}mm; margin: 0 !important; padding: 0 !important; }
            .paper-card { width: {{ formato.largura_mm }}mm !important; height: {{ formato.altura_mm }}mm !important; aspect-ratio: auto; box-shadow: none; }
            .paper-card img { width: {{ formato.largura_mm }}mm !important; height: {{ formato.altura_mm }}mm !important; object-fit: fill !important; }
        }
    </style>
</head>
<body>
    <header class="toolbar">
        <div class="toolbar-info">
            <h1>Cartaz <span id="paper-title">{{ formato.nome }}</span> <span>· {{ qr.codigo }}</span></h1>
            <p>Escolha a arte e o tamanho do papel. O QR Code aparece no campo central.</p>
        </div>

        <nav class="art-choices" aria-label="Escolha a arte do cartaz">
            {% for arte in artes %}
            <a class="art-choice" href="{{ url_for('qr.imprimir_qr', codigo=qr.codigo, arte=arte.id, tamanho=tamanho) }}"
                data-image-url="{{ url_for('qr.imagem_qr', codigo=qr.codigo, arte=arte.id, tamanho=tamanho) }}"
                data-download-a4-url="{{ url_for('qr.download_qr', codigo=qr.codigo, arte=arte.id, tamanho='a4') }}"
                data-download-a5-url="{{ url_for('qr.download_qr', codigo=qr.codigo, arte=arte.id, tamanho='a5') }}"
                aria-current="{{ 'page' if arte.id == arte_selecionada else 'false' }}">
                <img src="{{ url_for('static', filename=arte.thumbnail) }}" alt="">
                <span>{{ arte.nome }}</span>
            </a>
            {% endfor %}
        </nav>

        <nav class="paper-sizes" aria-label="Escolha o tamanho do papel">
            {% for id, opcao in tamanhos_papel.items() %}
            <a class="paper-size" href="{{ url_for('qr.imprimir_qr', codigo=qr.codigo, arte=arte_selecionada, tamanho=id) }}"
                aria-current="{{ 'page' if id == tamanho else 'false' }}">{{ opcao.nome }}</a>
            {% endfor %}
        </nav>

        <div class="toolbar-actions">
            <a href="{{ url_for('qr.gerenciar_qr', campanha_id=qr.campanha_id) }}" class="btn">Voltar</a>
            <a id="download-a4" href="{{ url_for('qr.download_qr', codigo=qr.codigo, arte=arte_selecionada, tamanho='a4') }}" class="btn">Baixar PNG A4</a>
            <a id="download-a5" href="{{ url_for('qr.download_qr', codigo=qr.codigo, arte=arte_selecionada, tamanho='a5') }}" class="btn btn-primary">Baixar PNG A5</a>
            <button type="button" onclick="window.print()" class="btn btn-primary">Imprimir</button>
        </div>
    </header>

    <main class="print-canvas-area">
        <div class="paper-card">
            <img id="poster-preview" src="{{ imagem_url }}" alt="Cartaz {{ formato.nome }} com o QR Code {{ qr.codigo }}">
        </div>
    </main>

    <script>
        const preview = document.getElementById("poster-preview");
        const downloadA4 = document.getElementById("download-a4");
        const downloadA5 = document.getElementById("download-a5");
        const artChoices = document.querySelectorAll(".art-choice");

        artChoices.forEach((choice) => {
            if (choice.dataset.imageUrl !== preview.src) {
                const preload = new Image();
                preload.decoding = "async";
                preload.src = choice.dataset.imageUrl;
            }

            choice.addEventListener("click", (event) => {
                event.preventDefault();
                preview.src = choice.dataset.imageUrl;
                downloadA4.href = choice.dataset.downloadA4Url;
                downloadA5.href = choice.dataset.downloadA5Url;
                artChoices.forEach((item) => item.setAttribute("aria-current", "false"));
                choice.setAttribute("aria-current", "page");
                window.history.replaceState({}, "", choice.href);
            });
        });
    </script>
</body>
</html>
