<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imprimir QR Code · Semana {{ qr.semana }} · {{ qr.codigo }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --knn-red: #ed1b2f;
            --knn-red-dark: #c9001d;
            --knn-red-light: #fff0f2;
            --text-dark: #111827;
            --bg-gray: #f3f4f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #e5e7eb;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            background: #ffffff;
            border-bottom: 1px solid #d1d5db;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .toolbar-info h1 {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar-info h1 span {
            background: var(--knn-red);
            color: #ffffff;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .toolbar-info p {
            font-size: 13px;
            color: #6b7280;
            margin-top: 2px;
        }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.15s ease;
        }

        .btn-primary {
            background: var(--knn-red);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--knn-red-dark);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .print-canvas-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 20px 60px;
        }

        .paper-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 680px;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #e5e7eb;
        }

        .paper-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        @media print {
            body {
                background: #ffffff !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .toolbar {
                display: none !important;
            }

            .print-canvas-area {
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
            }

            .paper-card {
                max-width: 100% !important;
                width: 100% !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                border: none !important;
                page-break-inside: avoid;
            }

            .paper-card img {
                width: 100% !important;
                height: 100vh !important;
                object-fit: contain !important;
            }

            @page {
                size: auto;
                margin: 0mm;
            }
        }
    </style>
</head>
<body>

    <header class="toolbar">
        <div class="toolbar-info">
            <h1>
                Poster da Missão
                <span>Semana {{ qr.semana }}</span>
            </h1>
            <p>
                Frase: <strong>"{{ qr.frase }}"</strong> &bull; Ponto: {{ qr.local_nome }} (Código: {{ qr.codigo }})
            </p>
        </div>

        <div class="toolbar-actions">
            <a href="{{ url_for('qr.gerenciar_qr', campanha_id=qr.campanha_id) }}" class="btn btn-secondary">
                &larr; Voltar
            </a>
            <a href="{{ url_for('qr.download_qr', codigo=qr.codigo) }}" class="btn btn-secondary">
                Baixar Imagem PNG
            </a>
            <button onclick="window.print()" class="btn btn-primary">
                &#128438; Imprimir Agora (Ctrl + P)
            </button>
        </div>
    </header>

    <main class="print-canvas-area">
        <div class="paper-card">
            <img src="{{ url_for('qr.imagem_qr', codigo=qr.codigo) }}" alt="QR Code com Frase da Semana {{ qr.semana }}">
        </div>
    </main>

</body>
</html>
