<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Black November KNN | Paraisópolis{% endblock %}</title>
<meta name="description" content="Black November KNN Paraisópolis. Conheça as condições de material gratuito e isenção da taxa de matrícula. Participe das comunidades KNN.">
<meta property="og:title" content="Black November KNN | Paraisópolis">
<meta property="og:description" content="Participe das comunidades do movimento Sementes da Liberdade e conheça as condições e os benefícios da Black November KNN Paraisópolis.">
<meta property="og:image" content="{{ url_for('static', filename='img/black-november-knn.jpeg', _external=True) }}">
<link rel="icon" href="{{ url_for('static', filename='img/logo-knn.png') | v }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') | v }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/landing-effects.css') | v }}">
{% block head %}{% endblock %}
</head>
<body class="conversion-page {% block body_class %}{% endblock %}">
{% block body %}{% endblock %}
{% if request.args.get('debug-motion') == '1' %}<script src="{{ url_for('static', filename='js/landing-diagnostics.js') | v }}" defer></script>{% endif %}
<script src="{{ url_for('static', filename='js/landing-effects.js') | v }}" defer></script>
</body>
</html>
