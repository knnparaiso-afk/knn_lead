        <div class="field">
            <label for="nome">Nome completo</label>
            <input id="nome" type="text" name="nome" maxlength="120" autocomplete="name" placeholder="Digite seu nome completo" required>
        </div>

        <div class="field">
            <label for="whatsapp">Número de celular</label>
            <input id="whatsapp" type="tel" name="whatsapp" maxlength="32" autocomplete="tel" inputmode="tel" placeholder="(00) 00000-0000" required>
        </div>

        <div class="lead-grid">
            <div class="field">
                <label for="idade">Idade</label>
                <input id="idade" type="number" name="idade" min="3" max="120" inputmode="numeric" placeholder="Ex.: 18" required>
            </div>
            <div class="field">
                <label for="email">E-mail</label>
                <input id="email" type="email" name="email" maxlength="254" autocomplete="email" placeholder="voce@email.com" required>
            </div>
        </div>

        <div class="consent participation-confirmation">
            <input type="checkbox" id="participacao_confirmada" name="participacao_confirmada" required>
            <label for="participacao_confirmada">Concordo em participar da campanha e autorizo a unidade KNN responsável a entrar em contato comigo por WhatsApp ou e-mail, inclusive para enviar mensagens sobre a campanha, novidades, promoções e oportunidades relacionadas aos cursos da unidade. Se a pessoa participante tiver menos de 18 anos, declaro ser pai, mãe ou responsável legal e autorizo sua participação e esses contatos.</label>
        </div>
